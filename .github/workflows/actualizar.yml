name: Actualizar prospectos

on:
  schedule:
    - cron: "0 12 * * *"   # todos los días 6:00 am hora de Monterrey
  workflow_dispatch: {}     # botón "Run workflow" para correrlo a mano

permissions:
  contents: write

concurrency:
  group: actualizar-prospectos
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Correr agente
        env:
          SITE_PASSWORD: ${{ secrets.SITE_PASSWORD }}
          BRAVE_API_KEY: ${{ secrets.BRAVE_API_KEY }}
        run: python -m agent.main
      - name: Guardar resultados
        run: |
          git config user.name "agente-inverteca"
          git config user.email "agente-inverteca@users.noreply.github.com"
          git add docs/data.enc.json
          git diff --cached --quiet || git commit -m "Actualizar prospectos $(date -u +%F)"
          git push
